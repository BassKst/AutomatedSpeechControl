name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.6"

      - name: Ruff check
        run: python -m ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (core + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      # Guards against the packaging regression where src/ subpackages without
      # __init__.py were silently dropped from the wheel.
      - name: Build wheel and sdist
        run: python -m build

      - name: Verify all packages are included
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          expected = [
              "assistant_core", "channels", "common", "nlu_server", "voice_biometrics",
          ]
          missing = [p for p in expected if not any(n.startswith(p + "/") for n in names)]
          assert not missing, f"wheel is missing packages: {missing}"
          print(f"OK - {wheel.name} contains all {len(expected)} packages")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker build -t asc-nlu:ci .

      # Сертификаты в образ не пекутся (.dockerignore), поэтому генерируем
      # самоподписанную пару на лету и монтируем туда, куда смотрит Dockerfile.
      - name: Generate throwaway TLS certificates
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/server.key -out certs/server.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"

      # Запуск контейнера ловит ошибки, которые не видны ни тестам, ни сборке:
      # например ConfigError из common/config.py при неверном PROJECT_ROOT.
      - name: Smoke-test the container
        run: |
          docker run -d --name asc-nlu-smoke -p 8000:8000 \
            -v "$PWD/certs:/app/certs:ro" asc-nlu:ci

          for _ in $(seq 1 30); do
            if curl -skf https://127.0.0.1:8000/docs >/dev/null; then
              echo "OK - NLU service responded over TLS"
              docker rm -f asc-nlu-smoke
              exit 0
            fi
            sleep 1
          done

          echo "FAIL - service did not come up in 30s; container logs:"
          docker logs asc-nlu-smoke
          docker rm -f asc-nlu-smoke
          exit 1

      - name: Report image size
        run: docker image ls asc-nlu:ci
